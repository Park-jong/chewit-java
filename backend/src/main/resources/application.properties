spring.application.name=chewit

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:chewit}
spring.datasource.username=${DB_USERNAME:chewit}
spring.datasource.password=${DB_PASSWORD:chewit}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:dev-only-change-me-please-use-a-long-random-string-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080

spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
